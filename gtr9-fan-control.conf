# Calibrated 2026-10-04: 12% gives ~690 RPM; 5% stops fan3.
# pwm2 has no usable tachometer; fan3 is checked while commanded to run.
poll_seconds=2
fall_delay_seconds=30
hysteresis_c=4
critical_temp_c=85
fan_stall_seconds=10
curve=0:12,50:25,60:35,70:55,78:75,85:100

# Stop after 30 seconds with every CPU core <=10% busy and GPU <=5% busy.
# CPU/GPU, motherboard and SSD must all be <=45C; resume at 50C or activity.
fan_stop_below_c=45
fan_resume_at_c=50
fan_stop_idle_seconds=30
